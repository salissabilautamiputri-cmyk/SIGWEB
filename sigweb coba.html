<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS WMS & WFS - Malaysia</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.8.0/dist/ol.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        #panel {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1000;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
            width: 220px;
        }

        button {
            margin-top: 8px;
            width: 100%;
            padding: 6px;
            border: none;
            border-radius: 5px;
            background: #059669;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<div id="panel">
    <b>WebGIS Malaysia</b>
    <br><br>

    <label>
        <input type="checkbox" id="wmsToggle" checked>
        WMS Layer
    </label><br>

    <label>
        <input type="checkbox" id="wfsToggle" checked>
        WFS Layer
    </label>

    <button id="zoomBtn">Zoom Malaysia</button>
</div>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/ol@10.8.0/dist/ol.js"></script>

<script>

    // =========================
    // BASEMAP
    // =========================
    const osm = new ol.layer.Tile({
        source: new ol.source.OSM()
    });

    // =========================
    // WMS (GLOBAL DATA)
    // =========================
    const wmsLayer = new ol.layer.Tile({
        source: new ol.source.TileWMS({
            url: "https://ahocevar.com/geoserver/wms",
            params: {
                LAYERS: "ne:ne_10m_admin_0_countries",
                TILED: true,
                FORMAT: "image/png",
                TRANSPARENT: true
            },
            serverType: "geoserver",
            crossOrigin: "anonymous"
        })
    });

    // =========================
    // WFS (VEKTOR MALAYSIA FILTER)
    // =========================
    const wfsSource = new ol.source.Vector({
        format: new ol.format.GeoJSON({
            dataProjection: "EPSG:4326",
            featureProjection: "EPSG:3857"
        }),
        url: "https://ahocevar.com/geoserver/wfs?service=WFS&version=1.1.0&request=GetFeature&typeName=ne:ne_10m_admin_0_countries&outputFormat=application/json&srsname=EPSG:3857",
        strategy: ol.loadingstrategy.all
    });

    const wfsLayer = new ol.layer.Vector({
        source: wfsSource,
        style: new ol.style.Style({
            stroke: new ol.style.Stroke({
                color: "#059669",
                width: 3
            }),
            fill: new ol.style.Fill({
                color: "rgba(5,150,105,0.2)"
            })
        })
    });

    // =========================
    // MAP CENTER MALAYSIA
    // =========================
    const map = new ol.Map({
        target: "map",
        layers: [osm, wmsLayer, wfsLayer],
        view: new ol.View({
            center: ol.proj.fromLonLat([102.0, 4.2]), // 🇲🇾 Malaysia
            zoom: 6
        })
    });

    // =========================
    // AUTO FIT WFS
    // =========================
    wfsSource.once("change", function () {
        if (wfsSource.getState() === "ready") {
            map.getView().fit(wfsSource.getExtent(), {
                padding: [50, 50, 50, 50],
                duration: 1000
            });
        }
    });

    // =========================
    // TOGGLE WMS
    // =========================
    document.getElementById("wmsToggle").addEventListener("change", function () {
        wmsLayer.setVisible(this.checked);
    });

    // =========================
    // TOGGLE WFS
    // =========================
    document.getElementById("wfsToggle").addEventListener("change", function () {
        wfsLayer.setVisible(this.checked);
    });

    // =========================
    // ZOOM MALAYSIA
    // =========================
    document.getElementById("zoomBtn").addEventListener("click", function () {
        map.getView().animate({
            center: ol.proj.fromLonLat([102.0, 4.2]),
            zoom: 6,
            duration: 800
        });
    });

    // =========================
    // POPUP CLICK FEATURE
    // =========================
    map.on("singleclick", function (evt) {

        const feature = map.forEachFeatureAtPixel(evt.pixel, f => f);

        if (feature) {
            const p = feature.getProperties();

            alert(
                "Country: " + (p.name || p.admin || "-") +
                "\nCode: " + (p.adm0_a3 || "-")
            );
        }

    });

</script>

</body>
</html>
